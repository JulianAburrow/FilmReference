name: Build and Test FilmReference

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore FilmReferenceBlazor.sln

      - name: Build only non-SQL projects
        run: |
          dotnet build FilmReferenceBlazor.sln --no-restore --configuration Release \
            /p:ExcludeProjects="FilmReferenceDatabase.sqlproj"

      - name: Run tests
        run: |
          dotnet test FilmReference.Tests/FilmReference.Tests.csproj \
            --no-build --configuration Release --verbosity normal