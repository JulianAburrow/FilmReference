name: Build and Test FilmReference

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build UI, DataAccess and Test projects
        run: |
          dotnet build FilmReferenceUI/FilmReferenceUI.csproj --no-restore --configuration Release
          dotnet build FilmReferenceDataAccess/FilmReferenceDataAccess.csproj --no-restore --configuration Release
          dotnet build FilmReferenceBlazor.Tests/FilmReferenceBlazor.Tests.csproj --no-restore --configuration Release

      - name: Run tests
        run: dotnet test FilmReferenceBlazor.Tests/FilmReferenceBlazor.Tests.csproj --no-build --configuration Release --verbosity normal